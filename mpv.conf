# ============================================
# mpv 配置文件 —— Windows + Intel/NVIDIA 双显卡
# 目的：正确播放杜比视界(HDR)、色调映射不偏色、画质优先
#
# 2026-09-13 修订：修复 9-06 18:54 那次重写造成的配置截断，
#   并撤掉两条在 SDR 屏上不起作用的选项（见下方 [空转] 说明）。
#   修订前版本已备份为 mpv.conf.bak-20260913
# ============================================

# ---------- 输出 / 渲染器 ----------
# gpu-next 渲染器：对 HDR/杜比视界的色彩管理支持最好
vo=gpu-next
# Windows 上用 D3D11（兼容性好，双显卡也稳）
gpu-api=d3d11
# 硬件解码（mpv 默认 hwdec-software-fallback=3，解不了会自动回落软解，安全）
# ⚠ d3d11va 的解码设备建在【当前渲染 GPU】上。所以：
#     渲染在核显 → 硬解成功
#     渲染在独显 → 建不起来，静默回落软解（日志会打 "No decoder device for codec found"）
#   本机 MX250 实测：d3d11va / nvdec / vulkan+nvdec / opengl+cuda / dxva2 全部软解，
#   nvidia-smi 恒 "Failed to initialize NVML" → 连 NVIDIA 自家工具都管不了它。
#   因此本配置【不写 d3d11-adapter】，让 mpv 用默认适配器（核显），以保住硬解。
hwdec=d3d11va
# 显示同步 —— 2026-09-13 修订：display-resample → audio。
#   ⚠ 实测（4K DV，45s/次，3 组交替顺序 + 2 组预跑 = 6 次对照）：
#        display-resample（旧值） 真丢帧 0.09 / 0.11 / 2.20 / 2.49 帧/秒 —— 间歇性爆发
#        audio（新值，也是 mpv 默认）  真丢帧 **6 次全部 0.00**
#   为什么砍掉：它在本机是【纯负收益】——
#     ① 承诺的平滑在 24fps@60Hz 下根本兑现不了
#        （官方文档：24fps on 60Hz 走 2-3-2-3 模式，3:2 抖动消不掉；
#          要真消除得开 interpolation，或把屏幕切到 48/120Hz）
#     ② 但它对时序要求更严格 → 来不及就丢帧 → 引入 0.1~2.5 帧/秒真丢帧
#   audio 的代价：24fps@60Hz 的 3:2 抖动照旧，但这与浏览器/电视/其他播放器一致，
#                且远好于"掉帧"这种硬卡顿。
video-sync=audio

# [空转] 以下两行在 SDR 屏上等价于默认值 auto，已停用（保留备查）
#   源码 d3d11_get_mp_csp()：G22/P709 映射为 mpv 内部的 UNKNOWN，走 auto 流程；
#   默认 auto 在本机 SDR 桌面上探测到的同样是 G22/P709 —— 结果完全一致。
#   色调映射的目标色彩空间来自显示器上报值，不是这两行决定的。
#   若将来接 HDR 屏 / 开 Windows HDR，交给 auto 跟随显示器才是正确行为。
# d3d11-output-csp=srgb
# target-colorspace-hint=yes

# ---------- HDR / 色调映射 ----------
# 提亮 DV/HDR 暗部的关键旋钮。SDR 目标下抬高此值 = 让色调映射少压一点。
# 2026-09-13 恢复：9-04 计划改成 250，但那一行在 9-06 重写时被删了，
#   实际生效值一直是 auto（SDR 曲线下 = 203 nit）。
target-peak=250

# 逐帧计算片源峰值（动态逐场景映射）。
# 它管的是"片源峰值"，与"显示器峰值"的 target-peak 是两个维度，不会互相覆盖。
hdr-compute-peak=no

# 官方文档建议：SDR 目标下把 target-peak 抬到 203 以上时，配 mobius（或 clip）更稳。
# 先留着不开，便于和当前 auto(=spline) 做单变量 A/B。
# 若出现高光生硬、发白，把下一行打开；想更贴近"调色良好内容"可用 bt.2446a。
# tone-mapping=mobius

# 有系统校色文件时自动加载（本机 cache 里确有 icc_* 被解析，不是空转）
icc-profile-auto=yes
# 4K 缩放到屏幕时的清晰度优化
linear-downscaling=yes
# 缩放器：ewa_lanczossharp 是 mpv 公认最佳放大器
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# ---------- 画质后期 ----------
# 去色带（deband-threshold 默认 48，这里 32 = 稍保守）
deband=yes
deband-iterations=1
deband-threshold=32
# 抖动到面板位深，消除灰阶断层
dither-depth=auto
# 插帧默认关（桌面 GPU 被抢占时插帧是丢帧放大器）
# 想开用 Ctrl+i 现场开（1080p 片源建议；4K 片源脚本已强制关）
interpolation=no

# ---------- 使用体验 ----------
# 2026-09-13 恢复：整段在 9-06 18:54 重写时被删掉，生效值曾全部退回默认
keep-open=yes
save-position-on-quit=yes
volume=100
sub-auto=fuzzy
sub-codepage=utf-8:gb18030
sub-font="Microsoft YaHei"
osd-font-size=44
title=${filename}

# ---------- 诊断 / 可观测性 ----------
# 2026-09-13 加。起因：自动画质档（scripts/auto-quality.lua）的降档/回升闭环
#   是本策略最大的未验证面，而 mpv 默认【不写日志文件】—— 播了一场之后
#   没有任何地方能查到它到底有没有触发。
#
# log-file：~~/ 展开为配置目录（本机 = %APPDATA%\mpv）。
#   实测：① 每次启动【覆盖写】，不会跨会话累积（连跑两次均 275 行）；
#        ② 启动时有一波约 275~385 行的固定突刺，稳态约 20~30 行/秒
#           —— 一集 45 分钟大约几 MB，可接受。
log-file="~~/mpv.log"
# ⚠ 不要在这里写 msg-level 来"降低日志详细度"——实测无效：
#   日志文件恒定按 debug 级写，--msg-level=all=no 也照样写满。
#   要精简请用过滤脚本（见仓库 tools/logcheck.py），别指望这个开关。
#   脚本报档位走的是 mp.msg.warn，日志里的模块前缀是 [auto_quality]。
#
# IPC：允许外部查询【运行中】实例的状态 —— frame-drop-count / scale / cscale /
#   deband / interpolation / width。有它就不用靠猜，能直接对着正在播的片子读实时丢帧。
# Windows 下是命名管道，只监听本机，不对外开放；不需要时注释掉即可。
# 注意：同时开两个 mpv 时，第二个会绑定失败（仅打一条错误，不影响播放）。
input-ipc-server="\\.\pipe\mpv-ipc"
