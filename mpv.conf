# ============================================
# mpv 配置文件 —— Windows + Intel/NVIDIA 双显卡
# 目的：正确播放杜比视界(HDR)、色调映射不偏色、画质优先
#
# 2026-09-13 修订：修复 9-06 18:54 那次重写造成的配置截断，
#   并撤掉两条在 SDR 屏上不起作用的选项（见下方 [空转] 说明）。
#   修订前版本已备份为 mpv.conf.bak-20260913
# ============================================

# ---------- 输出 / 渲染器 ----------
# gpu-next 渲染器：对 HDR/杜比视界的色彩管理支持最好
vo=gpu-next
# Windows 上用 D3D11（兼容性好，双显卡也稳）
gpu-api=d3d11
# 硬件解码（mpv 默认 hwdec-software-fallback=3，解不了会自动回落软解，安全）
hwdec=d3d11va
# 显示同步：消除 A/V 漂移和偶发丢帧
# 注意：它并不能消除 24p 在 60Hz 上的 3:2 抖动（官方文档：24fps on 60Hz 走 2-3-2-3 模式）
#       要真消除得开 interpolation，或把屏幕切到 48/120Hz
video-sync=display-resample

# [空转] 以下两行在 SDR 屏上等价于默认值 auto，已停用（保留备查）
#   源码 d3d11_get_mp_csp()：G22/P709 映射为 mpv 内部的 UNKNOWN，走 auto 流程；
#   默认 auto 在本机 SDR 桌面上探测到的同样是 G22/P709 —— 结果完全一致。
#   色调映射的目标色彩空间来自显示器上报值，不是这两行决定的。
#   若将来接 HDR 屏 / 开 Windows HDR，交给 auto 跟随显示器才是正确行为。
# d3d11-output-csp=srgb
# target-colorspace-hint=yes

# ---------- HDR / 色调映射 ----------
# 提亮 DV/HDR 暗部的关键旋钮。SDR 目标下抬高此值 = 让色调映射少压一点。
# 2026-09-13 恢复：9-04 计划改成 250，但那一行在 9-06 重写时被删了，
#   实际生效值一直是 auto（SDR 曲线下 = 203 nit）。
target-peak=250

# 逐帧计算片源峰值（动态逐场景映射）。
# 它管的是"片源峰值"，与"显示器峰值"的 target-peak 是两个维度，不会互相覆盖。
hdr-compute-peak=no

# 官方文档建议：SDR 目标下把 target-peak 抬到 203 以上时，配 mobius（或 clip）更稳。
# 先留着不开，便于和当前 auto(=spline) 做单变量 A/B。
# 若出现高光生硬、发白，把下一行打开；想更贴近"调色良好内容"可用 bt.2446a。
# tone-mapping=mobius

# 有系统校色文件时自动加载（本机 cache 里确有 icc_* 被解析，不是空转）
icc-profile-auto=yes
# 4K 缩放到屏幕时的清晰度优化
linear-downscaling=yes
# 缩放器：ewa_lanczossharp 是 mpv 公认最佳放大器
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# ---------- 画质后期 ----------
# 去色带（deband-threshold 默认 48，这里 32 = 稍保守）
deband=yes
deband-iterations=1
deband-threshold=32
# 抖动到面板位深，消除灰阶断层
dither-depth=auto
# 插帧默认关（桌面 GPU 被抢占时插帧是丢帧放大器）
# 想开用 Ctrl+i 现场开（1080p 片源建议；4K 片源脚本已强制关）
interpolation=no

# ---------- 使用体验 ----------
# 2026-09-13 恢复：整段在 9-06 18:54 重写时被删掉，生效值曾全部退回默认
keep-open=yes
save-position-on-quit=yes
volume=100
sub-auto=fuzzy
sub-codepage=utf-8:gb18030
sub-font="Microsoft YaHei"
osd-font-size=44
title=${filename}
